# ============ 搜索条件 ============
search:
  # 每个关键词跑一轮搜索。搜索词决定「能看到哪些岗位」，filters.topic 决定
  # 「留下哪些」——方向词只写在 topic 里没用，搜索这边不搜就永远碰不到。
  #
  # **顺序即优先级。** 主流程按这个列表从上往下跑，每日配额（pacing.daily_limit）
  # 和 -n 限制都是从上往下消耗的，撞到上限整轮就停——排在后面的关键词很可能
  # 一个岗位都轮不到。所以想优先投什么方向，就把它的词提到最前面。
  keywords:
    # —— Golang 方向优先 ——
    # 顺序按实测第 1 页的「初筛通过数」排的，产出高的放前面。
    # 「Go 高级工程师」测下来 4 个通过里 3 个跟上面重复，没收录。
    - "Golang 开发"
    - "Go 开发工程师"
    - "Golang 后端"
    - "Go 服务端"
    - "Golang 架构师"
    # —— 再看 AI 方向（多数也要求 Go，topic 白名单会把方向兜住）——
    - "大模型 后端"
    - "Agent 开发"
    - "AI 应用平台"
    - "大模型 应用"
    - "AI 架构师"
    # —— 配额有剩才轮到这些 ——
    - "Python 后端"
    - "Python 开发"
    - "Node.js 后端"
  city: "北京"          # 见 boss_greeter/cities.py 的城市码表
  max_pages: 10          # 每个关键词最多翻几页（一页 15 个）

# ============ 筛选规则 ============
filters:
  # 岗位来源：猎头代招和应届岗一律不投。
  # 猎头岗跟公司自招混在同一批搜索结果里，只看标题分不出来，
  # 得靠接口的 proxyJob / goldHunter 字段（就是卡片左上角那个「猎头」角标）。
  job_source:
    enabled: true
    exclude_headhunter: true
    exclude_campus: true

  # 只要研发岗。岗位名命中这些词就拒——这类岗位的 JD 里常堆满 AI/Python，
  # 光靠下面的 topic 白名单拦不住（「AI产品经理」「大模型解决方案顾问」都会命中）。
  # deny 留空则用代码里的默认词表（见 filters.NON_RND_TITLES）。
  rnd_only:
    enabled: true
    deny: []

  # 方向白名单：岗位名或技能标签命中任一才继续。这是「只看 golang / AI」的总闸门——
  # BOSS 的搜索结果很散，搜 Golang 也会返回游戏开发、存储中间件之类的岗位。
  # 英文词按独立单词匹配（chain / training 里的 ai、MongoDB 里的 go 不会误伤），
  # 中文词按包含匹配。留空 = 不限方向。
  topic:
    enabled: true
    allow:
      # —— Golang ——
      - "golang"
      - "go"
      - "go语言"
      - "gin"
      - "kratos"
      - "go-zero"
      # —— Node.js ——
      - "nodejs"
      - "node.js"
      - "node"
      - "typescript"
      - "ts"
      - "nestjs"
      - "express"
      - "egg.js"
      # —— Python ——
      - "python"
      - "django"
      - "flask"
      - "fastapi"
      - "celery"
      # —— AI ——
      - "AI"
      - "AIGC"
      - "LLM"
      - "RAG"
      - "MCP"
      - "Agent"
      - "大模型"
      - "人工智能"
      - "智能体"
      - "多模态"
      - "机器学习"
      - "深度学习"
      - "算法"

  activity:
    # 默认关。BOSS 已经把「X 日内活跃」这类文案从列表页和它自己的接口里一起撤掉了，
    # 现在唯一能拿到的活跃信号只有 HR 此刻是否在线。开启 = 只投此刻在线的 HR，
    # 回复快但会砍掉大部分岗位（多数 HR 任一时刻都不在线）。
    enabled: false
    allow: ["在线"]

  salary:
    enabled: true
    min_k: 20           # 月薪下限（K）。岗位薪资上限 >= 该值才通过
    allow_negotiable: false   # "面议" 是否放行

  city:
    enabled: false
    allow: ["北京"]

  education:
    enabled: false
    # 岗位要求学历不得高于此值（本科 < 硕士 < 博士）
    max_required: "本科"

  company_size:
    enabled: false
    # 命中任一即通过；留空表示不限
    allow: ["100-499人", "500-999人", "1000-9999人", "10000人以上"]

  keyword:
    enabled: true
    # 岗位名 / 公司名 / JD 命中任一 → 直接跳过。
    # 这组词主要是拦外包：外包岗很少在标题里写「外包」，多半藏在 JD 的
    # 「入驻甲方」「客户现场」「人力外包」这类措辞里，所以 jd 也在匹配字段内。
    blacklist:
      - "外包"
      - "驻场"
      - "外派"
      - "人力资源"
      - "劳务派遣"
      - "人力服务"
      - "人才服务"
      - "人才外包"
      - "人力外包"
      - "技术外包"
      - "服务外包"
      - "外包事业"
      - "甲方"
      - "客户现场"
      - "常驻客户"
      - "人才派遣"
      - "电话销售"
      - "实习"
      - "兼职"
    # 留空表示不限；非空则 JD 必须命中至少一个
    whitelist: []
    # 白名单只在 JD 上匹配，黑名单在岗位名/公司名/JD 上都匹配
    blacklist_fields: ["title", "company", "jd"]

# ============ 招呼语 ============
greeting:
  # 指向你自己的简历（Markdown / 纯文本都行）。resume/ 整个目录已 gitignore
  resume_path: "./resume/我的简历.md"
  # anthropic | openai（openai 也适用于任何 OpenAI 兼容的第三方网关）
  # 这里的 openai 是「说 OpenAI 那套协议」的意思；具体能用哪些模型，
  # 取决于 .env 里 OPENAI_BASE_URL 指的那个网关。
  provider: "openai"
  # 模型名以网关认的为准（curl <网关>/v1/models 可列）。
  model: "kimi-k3"
  min_chars: 60
  max_chars: 200
  # LLM 连续失败或校验不过时的兜底模板
  fallback_template: "您好，看到贵司的{title}岗位，方向和我的经历比较契合，方便简单聊聊吗？"

# ============ AI 判定岗位（外包 / 销售）============
# 规则黑名单只能匹字面词，外包岗的写法千变万化——「入驻合作伙伴团队」
# 「为客户提供驻场技术支持」一个关键词都不命中。这一层把 JD 丢给模型做二分类补上。
# 只在通过了全部规则、JD 已到手的岗位上跑，一个岗位一次调用。
ai_screen:
  enabled: true
  # 留空则跟 greeting 的 provider / model 走
  provider: ""
  model: ""
  # 判定命中这些类别就跳过。可选 OUTSOURCE（外包）、SALES（销售）
  skip: ["OUTSOURCE", "SALES"]
  # 判定失败是放行的；连续失败这么多次说明模型/网关挂了，
  # 这层形同虚设，不如停下来告诉你。
  max_consecutive_failures: 5

# ============ 限速与熔断 ============
pacing:
  # 每日打招呼硬上限。**注意：132 高于平台自己的上限（约 100 条）**，
  # 所以这道闸门实际不会先触发——先撞上的是 BOSS 的「今日沟通次数已达上限」，
  # 那会走熔断直接退出整轮。等于「不设日上限，由平台喊停」。
  # 真正的约束一直是每小时发多少（实测一小时 42 条被强制登出），看 send_delay。
  daily_limit: 132
  action_delay: [2.0, 5.0]  # 单步操作间隔随机区间（秒）：翻页、点详情页这类
  # 两次「发送」之间的间隔。这条是规避机器人验证的主要手段——
  # 用模型写招呼语时每个岗位本来要等十几秒到一分钟，节奏自然就慢；
  # --default-greeting 不调模型，少了那段停顿，全靠这里显式拉开。
  # 另有 15% 概率把间隔再乘 1.8-3 倍，模拟真人中途分神，免得间隔分布太规整。
  send_delay: [10.0, 25.0]
  batch_size: [8, 12]       # 发送多少个后长休息（区间内随机）
  batch_rest: [90, 210]     # 长休息时长（秒）：1.5-3.5 分钟
  max_consecutive_failures: 3

# ============ 浏览器 ============
browser:
  # 接管你自己开着的 Chrome（推荐）。登录完全手动完成，工具只是连上去干活。
  # 先跑 `uv run boss chrome` 启动带调试端口的 Chrome，在里面手动登录 BOSS，
  # 再跑 `uv run boss login` 确认。留空则退回工具自启浏览器（易被 BOSS 识破）。
  attach_cdp: "http://127.0.0.1:9222"
  chrome_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  chrome_user_data_dir: ""   # 留空 → data/chrome-profile（不能用 Chrome 默认目录）
  # 以下几项只在自启模式（attach_cdp 留空）下生效
  channel: "chrome"         # 用本机真实 Chrome；留空则用 Playwright 自带 Chromium
  headless: false           # headless 更易被风控识别，建议保持 false
  slow_mo_ms: 80
  viewport: [1440, 900]
  nav_timeout_ms: 30000
